name: CI

# The examples are transcriptions of District-accepted submittals and the tests assert the pipeline still reproduces
# them. That baseline is only worth having if it runs without being remembered.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check hydrostudy tests scripts

      # LibreOffice is deliberately not installed: the one PDF test skips without Writer, and installing the suite
      # would add minutes to every run for a single assertion. PDF export is covered locally and in the runbook.
      - name: Tests
        run: pytest -q
