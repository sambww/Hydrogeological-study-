[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrostudy"
version = "0.1.0"
description = "Generates draft hydrogeological reports (LSGCD-style) from a YAML intake and local public data extracts."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "shapely>=2.0",
  "pyproj>=3.5",
  "pandas>=2.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "pymupdf>=1.24"]
connectors = ["requests>=2.31"]

[project.scripts]
hydrostudy = "hydrostudy.cli:main"

[tool.setuptools.packages.find]
include = ["hydrostudy*"]

[tool.setuptools.package-data]
hydrostudy = ["districts/*.yaml", "reference/*.yaml", "report/narrative/*.j2", "report/static/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501", "B008"]
